HATS Neon:
  modes:
    light:
      primary-background-color: rgb(24, 27, 38)
      secondary-background-color: rgb(24, 27, 38)
      ha-card-background: rgba(24, 27, 38, 0.55)
    dark:
      primary-background-color: rgb(4, 5, 10)
      secondary-background-color: rgb(4, 5, 10)
      ha-card-background: rgba(6, 8, 16, 0.52)
  ultimate-background: "linear-gradient(140deg, #12002b 0%, #04050a 55%, #001a2b 100%)"
  background-image: "center / cover no-repeat fixed linear-gradient(140deg, #12002b 0%, #04050a 55%, #001a2b 100%)"
  lovelace-background: var(--background-image)
  app-theme-color: "#003959"
  ha-card-backdrop-filter: blur(10px) saturate(1.8) brightness(0.92)
  ha-card-border-radius: 12px
  ha-card-features-border-radius: var(--ha-card-border-radius)
  ha-card-border-width: 1px
  ha-card-border-color: color-mix(in srgb, var(--ultimate-glow-color) 45%, transparent)
  ha-card-glass-tint: rgba(6, 8, 16, 0.55)
  ha-card-glass-sheen: linear-gradient(180deg, color-mix(in srgb, var(--ultimate-glow-color) 22%, transparent) 0%, rgba(255,255,255,0.02) 2px, rgba(255,255,255,0) 40%)
  ha-card-glass-inset-shadow: |
    0 0 0 1px color-mix(in srgb, var(--ultimate-glow-color) 30%, transparent), 0 0 18px -6px color-mix(in srgb, var(--ultimate-glow-color) 55%, transparent), 0 0 40px -20px color-mix(in srgb, var(--ultimate-glow-color) 80%, transparent) inset, 0 10px 30px -16px rgba(0,0,0,0.90)
  ha-card-box-shadow: |
    0 0 0 1px color-mix(in srgb, var(--ultimate-glow-color) 30%, transparent), 0 0 18px -6px color-mix(in srgb, var(--ultimate-glow-color) 55%, transparent), 0 0 40px -20px color-mix(in srgb, var(--ultimate-glow-color) 80%, transparent) inset, 0 10px 30px -16px rgba(0,0,0,0.90)
  ultimate-glow-color: "#00A3FF"
  ultimate-transition: box-shadow 160ms ease, transform 160ms ease, border-color 160ms ease
  primary-color: "#00A3FF"
  accent-color: var(--primary-color)
  light-primary-color: "#E6F1FF"
  divider-color: color-mix(in srgb, var(--ultimate-glow-color) 28%, transparent)
  ha-color-primary-05: "#001420"
  ha-color-primary-10: "#002940"
  ha-color-primary-20: "#005280"
  ha-color-primary-30: "#007abf"
  ha-color-primary-40: "#00A3FF"
  ha-color-primary-50: "#2ab2ff"
  ha-color-primary-60: "#55c2ff"
  ha-color-primary-70: "#80d1ff"
  ha-color-primary-80: "#aae0ff"
  ha-color-primary-90: "#d4f0ff"
  ha-color-primary-95: "#eaf7ff"
  red-color: "#FF2D55"
  pink-color: "#FF2D9B"
  purple-color: "#A855F7"
  indigo-color: "#6366F1"
  blue-color: "#00A3FF"
  light-blue-color: "#22D3EE"
  cyan-color: "#00F0FF"
  teal-color: "#14F1C8"
  green-color: "#39FF14"
  yellow-color: "#FFE600"
  orange-color: "#FF8A00"
  brown-color: "#C08552"
  grey-color: "#7A8290"
  primary-text-color: rgba(233, 243, 255, 0.97)
  secondary-text-color: rgba(160, 176, 200, 0.85)
  disabled-text-color: rgba(110, 122, 142, 0.55)
  text-primary-color: var(--primary-text-color)
  text-dark-color: var(--primary-text-color)
  ha-color-text-secondary: var(--secondary-text-color)
  lumo-body-text-color: var(--primary-text-color)
  sidebar-background-color: rgba(4, 5, 10, 0.72)
  sidebar-icon-color: var(--light-primary-color)
  sidebar-text-color: var(--light-primary-color)
  sidebar-selected-background-color: color-mix(in srgb, var(--ultimate-glow-color) 18%, transparent)
  sidebar-selected-icon-color: var(--primary-color)
  sidebar-selected-text-color: var(--sidebar-selected-icon-color)
  app-header-background-color: rgba(4, 5, 10, 0.42)
  app-header-backdrop-filter: var(--ha-card-backdrop-filter)
  app-header-text-color: var(--primary-text-color)
  app-header-edit-background-color: rgba(0, 0, 0, 0.80)
  card-background-color: rgba(10, 12, 22, 0.94)
  paper-card-background-color: var(--ha-card-background)
  paper-listbox-background-color: rgba(10, 12, 22, 0.94)
  rgb-card-background-color: rgb(6, 8, 16)
  clear-background-color: var(--ha-card-background)
  mdc-theme-surface: rgba(10, 12, 22, 0.94)
  material-background-color: rgba(10, 12, 22, 0.94)
  table-row-background-color: rgba(10, 12, 22, 0.94)
  table-row-alternative-background-color: rgba(18, 21, 34, 0.94)
  md-list-container-color: none
  ha-dialog-surface-background: rgba(8, 10, 20, 0.86)
  ha-dialog-surface-backdrop-filter: none
  ha-dialog-scrim-backdrop-filter: blur(2px)
  dialog-box-shadow: var(--ha-card-box-shadow)
  paper-dialog-background-color: rgba(8, 10, 20, 0.86)
  more-info-header-background: rgba(4, 5, 10, 0.42)
  mdc-dialog-scrim-color: rgba(0, 0, 0, 0.78)
  state-icon-color: var(--primary-text-color)
  state-icon-active-color: var(--primary-color)
  state-icon-unavailable-color: var(--disabled-text-color)
  state-inactive-color: var(--disabled-text-color)
  paper-item-icon-color: var(--primary-text-color)
  paper-item-icon-active-color: var(--state-icon-active-color)
  paper-slider-knob-color: "#FFFFFF"
  paper-slider-knob-start-color: var(--paper-slider-knob-color)
  paper-slider-pin-color: var(--paper-slider-knob-color)
  paper-slider-active-color: var(--primary-color)
  paper-slider-secondary-color: var(--paper-slider-knob-color)
  paper-slider-container-color: rgba(160, 176, 200, 0.20)
  ha-slider-background: none !important
  switch-checked-track-color: var(--primary-color)
  switch-checked-button-color: "#FFFFFF"
  switch-unchecked-track-color: var(--disabled-text-color)
  switch-unchecked-button-color: "#FFFFFF"
  paper-toggle-button-checked-bar-color: var(--primary-color)
  paper-toggle-button-checked-button-color: "#FFFFFF"
  paper-toggle-button-unchecked-bar-color: var(--disabled-text-color)
  paper-toggle-button-unchecked-button-color: "#FFFFFF"
  ha-badge-border-radius: 8px
  label-badge-background-color: rgba(10, 12, 22, 0.94)
  label-badge-text-color: var(--primary-text-color)
  label-badge-red: var(--red-color)
  input-ink-color: var(--primary-text-color)
  input-fill-color: transparent
  input-disabled-fill-color: transparent
  input-label-ink-color: var(--primary-text-color)
  input-disabled-ink-color: var(--disabled-text-color)
  input-dropdown-icon-color: var(--primary-text-color)
  input-idle-line-color: var(--secondary-text-color)
  input-hover-line-color: var(--primary-color)
  ha-color-form-background: var(--ha-card-background)
  ha-color-form-background-hover: var(--ha-card-background)
  ha-color-form-background-disabled: var(--ha-card-background)
  mdc-checkbox-unchecked-color: var(--secondary-text-color)
  mdc-radio-unchecked-color: var(--secondary-text-color)
  codemirror-property: var(--accent-color)
  markdown-code-background-color: rgba(0, 0, 0, 0.70)
  code-editor-background-color: rgba(0, 0, 0, 0.70)
  wa-shadow-m: var(--ha-card-box-shadow)
  wa-border-radius-s: var(--ha-card-border-radius)
  wa-border-radius-m: 12px
  wa-border-width-s: 0px
  wa-color-neutral-fill-normal: color-mix(in srgb, var(--ultimate-glow-color) 14%, transparent)
  ha-color-on-neutral-normal: var(--primary-text-color)
  ha-color-fill-primary-quiet-resting: color-mix(in srgb, var(--ultimate-glow-color) 14%, transparent)
  ha-color-fill-primary-quiet-hover: color-mix(in srgb, var(--ultimate-glow-color) 26%, transparent)
  mush-spacing: 8px
  mush-icon-border-radius: 8px
  mush-control-border-radius: 8px
  mush-chip-border-radius: 8px
  mush-chip-background: var(--ha-card-background)
  mush-rgb-white: 255, 255, 255
  mush-title-font-weight: 600
  mush-title-letter-spacing: 0.02em
  ha-tile-icon-border-radius: 8px
  mcg-title-letter-spacing: 0.15em
  mini-media-player-base-color: var(--primary-text-color)
  mini-media-player-icon-color: var(--primary-text-color)
  card-mod-theme: Ultimate Neon
  card-mod-root: |
    /* ---- iOS-safe fixed background ------------------------------------
       background-attachment: fixed is janky/ignored on iOS Safari and the HA
       companion app. Painting the backdrop onto a fixed pseudo-element gives
       the same parallax-free result everywhere. */
    :host::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: var(--ultimate-background);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: -2;
      pointer-events: none;
    }
    :host::after {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(120% 90% at 50% 0%, rgba(0,0,0,0.10) 0%, rgba(0,0,0,0.55) 70%, rgba(0,0,0,0.78) 100%);
      z-index: -1;
      pointer-events: none;
    }

    /* ---- HA colour tokens ---------------------------------------------- */
    :host {
      --token-rgb-primary: 0, 163, 255;
      --token-rgb-black: 0, 0, 0;
      --token-rgb-white: 255, 255, 255;
      --token-rgb-purple: 168, 85, 247;
      --token-rgb-pink: 255, 45, 155;
      --token-rgb-red: 255, 45, 85;
      --token-rgb-deep-purple: 168, 85, 247;
      --token-rgb-indigo: 99, 102, 241;
      --token-rgb-blue: 0, 163, 255;
      --token-rgb-light-blue: 34, 211, 238;
      --token-rgb-cyan: 0, 240, 255;
      --token-rgb-teal: 20, 241, 200;
      --token-rgb-green: 57, 255, 20;
      --token-rgb-light-green: 57, 255, 20;
      --token-rgb-lime: 57, 255, 20;
      --token-rgb-yellow: 255, 230, 0;
      --token-rgb-amber: 255, 230, 0;
      --token-rgb-orange: 255, 138, 0;
      --token-rgb-deep-orange: 255, 138, 0;
      --token-rgb-brown: 192, 133, 82;
      --token-rgb-grey: 142, 142, 147;
      --token-rgb-blue-grey: 120, 130, 145;
      --token-rgb-state-icon: 255, 255, 255;
      --token-size-radius-card: var(--ha-card-border-radius);
    }

    /* ---- scrollbars ---------------------------------------------------- */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: color-mix(in srgb, var(--ultimate-glow-color) 40%, transparent);
      border-radius: 8px;
    }
    ::-webkit-scrollbar-thumb:hover { background: var(--primary-color); }
  card-mod-card: |
    /* ================= BASE RESET ================= */
    ha-card {
      background: transparent;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      border: 1px solid var(--ha-card-border-color);
      transition: var(--ultimate-transition);
    }

    /* ================= GLASS LAYER =================
       Sits behind the card content so blur never touches text. */
    ha-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--ha-card-glass-tint);
      backdrop-filter: var(--ha-card-backdrop-filter);
      -webkit-backdrop-filter: var(--ha-card-backdrop-filter);
      z-index: -1;
      pointer-events: none;
      border-radius: inherit;
      box-shadow: var(--ha-card-glass-inset-shadow);
    }

    /* ================= SPECULAR SHEEN =================
       Real glass has a bright top rim. This is the single biggest visual
       upgrade over the source themes, which only blur. */
    ha-card::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      background: var(--ha-card-glass-sheen);
      z-index: 0;
      mix-blend-mode: screen;
    }
    ha-card > * { position: relative; z-index: 1; }

    /* ================= HOVER LIFT ================= */
    @media (hover: hover) and (prefers-reduced-motion: no-preference) {
      ha-card:hover {
        transform: translateY(-1px);
      }
      ha-card:hover::before {
        box-shadow: var(--ha-card-glass-inset-shadow),
                    0 0 30px -4px var(--ultimate-glow-color);
      }
    }

    /* ================= NO-BACKDROP-FILTER FALLBACK =================
       Old WebViews (some Android companion builds) do not support
       backdrop-filter. Without this the cards render fully transparent
       and become unreadable over the background image. */
    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
      ha-card::before {
        background: rgba(10, 12, 22, 0.94);
      }
    }

    /* ================= EXCLUSIONS =================
       Cards that must stay flat, or that draw their own surface. */
    :host(hui-heading-card) ha-card,
    :host(hui-glance-card) ha-card,
    :host(mushroom-title-card) ha-card,
    :host(mushroom-chips-card) ha-card,
    :host(.type-custom-bubble-card) ha-card,
    ha-card.text-only {
      background: none !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      box-shadow: none !important;
      border: none !important;
    }
    :host(hui-heading-card) ha-card::before,
    :host(hui-heading-card) ha-card::after,
    :host(hui-glance-card) ha-card::before,
    :host(hui-glance-card) ha-card::after,
    :host(mushroom-title-card) ha-card::before,
    :host(mushroom-title-card) ha-card::after,
    :host(mushroom-chips-card) ha-card::before,
    :host(mushroom-chips-card) ha-card::after,
    :host(.type-custom-bubble-card) ha-card::before,
    :host(.type-custom-bubble-card) ha-card::after,
    ha-card.text-only::before,
    ha-card.text-only::after {
      content: none !important;
      background: none !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
    }
    :host(.type-custom-bubble-card) ha-card {
      border-radius: 0px !important;
    }

    /* ================= DATA TABLES ================= */
    .mdc-data-table,
    .mdc-data-table__row,
    ha-sankey-chart {
      background: none !important;
    }
    .mdc-data-table__header-cell {
      background: var(--ha-card-glass-tint) !important;
      backdrop-filter: var(--ha-card-backdrop-filter) !important;
      -webkit-backdrop-filter: var(--ha-card-backdrop-filter) !important;
    }
  card-mod-sidebar: |
    /* The blur goes on the sidebar's inner elements, never on `:host`.

       `backdrop-filter` on the `ha-sidebar` host corrupts the layout of an
       iframe panel rendered next to it. Chrome composites the blurred host onto
       its own layer and the iframe's document starts resolving positions
       against a stale coordinate space, so elements get painted at an origin
       their own parent does not agree with. In HACS that means a dialog whose
       contents spill outside the box with the version dropdown floating loose.

       Measured on the HACS download dialog - dialog surface always [525,197],
       the numbers are where its children land:

         blur on :host                        [136,33]   broken, 3/3
         + will-change: transform on iframe   [136,33]   broken
         + translateZ(0) on ha-panel-custom   [136,33]   broken
         + translateZ(0) on the iframe        flaky - passed once, failed once
         + contain: paint on the sidebar      [136,33]   broken, 2/2
         blur on .menu / .panels-list         [525,250]  correct, 4/4

       Promoting the iframe to its own layer looked like it worked and did not
       survive retesting; only moving the filter off the host does. The visual
       result is identical - those two elements cover the whole sidebar.

       This only became visible once `extra_module_url` was added, because that
       is what makes card-mod run outside Lovelace: before it, the sidebar was
       never blurred on a panel like HACS in the first place. */
    :host {
      background: none !important;
    }
    .menu,
    .panels-list {
      backdrop-filter: var(--ha-card-backdrop-filter);
      -webkit-backdrop-filter: var(--ha-card-backdrop-filter);
    }
    ha-list-item-button,
    ha-list-item-button.selected::before,
    ha-md-list-item,
    ha-md-list-item.selected::before,
    paper-icon-item {
      border-radius: var(--ha-card-border-radius) !important;
      --ha-list-item-focus-radius: var(--ha-card-border-radius) !important;
    }
    ha-md-list-item.selected,
    paper-icon-item.iron-selected {
      background: var(--ha-color-fill-primary-quiet-resting) !important;
    }
  card-mod-top-app-bar-fixed: |
    /* The header sits above every panel, not just dashboards. */
    :host {
      backdrop-filter: var(--ha-card-backdrop-filter);
      -webkit-backdrop-filter: var(--ha-card-backdrop-filter);
    }
  card-mod-dialog: |
    /* more-info, settings dialogs, pickers.

       No `backdrop-filter` here either, for the same reason as
       `ha-dialog-surface-backdrop-filter` above: it would make the dialog a
       containing block and throw every dropdown opened inside it out of place.
       Dialogs get their depth from `ha-dialog-surface-background` and from the
       blurred scrim behind them instead. */
    :host {
      --dialog-backdrop-filter: none;
    }
  card-mod-config: |
    /* Settings, Developer Tools, History - every built-in non-Lovelace panel.

       These must paint the backdrop themselves. `card-mod-root` is injected
       into `hui-root`, which is the *Lovelace* root - it does not exist here,
       so its fixed pseudo-element can never reach this panel.

       Three things this block gets deliberately right, each of which was wrong
       in 0.0.1 and cost an evening to find:

       1. Not `:host`. `ha-panel-config` has no shadow root of its own, so
          card-mod falls back to the shadow root of `home-assistant-main`.
          `:host` there resolves to `home-assistant-main`, whose background is
          covered by the opaque `ha-drawer` on top of it. Target elements in
          that tree by name instead.

       2. Not a negative-z pseudo-element. There is no stacking context here to
          sit behind, so `z-index: -2` puts the layer behind the document
          background and it never renders.

       3. Paint on `ha-drawer`, not on the panel. The drawer spans the whole
          viewport - sidebar included - so the sidebar's own backdrop-filter
          finally has an image to blur. Painting only `ha-panel-config` gives
          you a backdrop in the content area and a flat grey sidebar beside it,
          which is exactly the seam this fixes. */
    ha-drawer {
      background-image: radial-gradient(120% 90% at 50% 0%, rgba(0,0,0,0.10) 0%, rgba(0,0,0,0.55) 70%, rgba(0,0,0,0.78) 100%), var(--ultimate-background);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }
    ha-panel-config,
    partial-panel-resolver {
      background: transparent !important;
    }
    ha-card {
      background: var(--ha-card-glass-tint) !important;
      backdrop-filter: var(--ha-card-backdrop-filter);
      -webkit-backdrop-filter: var(--ha-card-backdrop-filter);
      border-radius: var(--ha-card-border-radius) !important;
      box-shadow: var(--ha-card-glass-inset-shadow) !important;
    }
  card-mod-panel-custom: |
    /* Custom panels. They render their own frontend inside an iframe or their
       own shadow tree, so only the outer surface is reachable - but that is
       enough to carry the backdrop. Same reasoning as `card-mod-config` above:
       paint the drawer, not the panel.

       The sidebar keeps its blur here. `backdrop-filter` on the `ha-sidebar`
       host used to corrupt the layout of the iframe rendered beside it; that is
       fixed in `card-mod-sidebar` above, by putting the filter on the sidebar's
       inner elements instead of its host. Promoting the iframe to its own layer
       was tried first and did not hold up - see the measurements there. */
    ha-drawer {
      background-image: radial-gradient(120% 90% at 50% 0%, rgba(0,0,0,0.10) 0%, rgba(0,0,0,0.55) 70%, rgba(0,0,0,0.78) 100%), var(--ultimate-background);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }
    ha-panel-custom,
    partial-panel-resolver {
      background: transparent !important;
    }
  card-mod-view: |
    /* Per-view background override hook.
       Set --ultimate-view-background in a view's card_mod to give that single
       tab its own backdrop - see docs/PER-VIEW-BACKGROUNDS.md

       This block is also what makes a per-view `theme:` change the backdrop.
       Home Assistant applies a view's theme to `hui-view-container`, which is
       *below* `hui-root` - so the backdrop `card-mod-root` paints on the root
       always resolves to the profile theme, no matter what the tab is set to.
       Colours changed per tab, the image never did. Painting here instead puts
       the backdrop inside the scope the view theme actually reaches.

       Not `:host`: `hui-view` has no shadow root, so card-mod injects this into
       `hui-root`'s shadow root, where `:host` is `hui-root` - the wrong element,
       with the wrong theme in scope. Target `hui-view` by name.

       The fallback chain means this is a no-op where nothing is overridden: an
       explicit --ultimate-view-background wins, otherwise the theme in scope at
       view level, which on an unthemed tab is the same image already painted
       underneath. */
    hui-view::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: var(--ultimate-view-background, var(--ultimate-background));
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: -2;
      pointer-events: none;
      opacity: var(--ultimate-view-background-opacity, 1);
    }
  hats-background: "linear-gradient(140deg, #12002b 0%, #04050a 55%, #001a2b 100%)"
